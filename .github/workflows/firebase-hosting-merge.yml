name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. تثبيت أداة pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: latest

      # 2. إعداد بيئة Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 3. تثبيت الحزم والاعتمادات
      - run: pnpm install

      # 4. بناء المشروع
      - run: pnpm build

      # 5. النشر على Firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AM_STORE_12B7D }}
          channelId: live
          projectId: am-store-12b7d